<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет - Mobitva(МоБитва)</title>
    <link rel="icon" type="image/png" href="img/books.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <div class="wrapper">
        <div class="header-wrapper">
            <a href="https://mobitva.net" target="_blank">mobitva.net</a>
            <div class="site-title">👤 ЛИЧНЫЙ КАБИНЕТ 👤</div>
            <a href="https://mmobitva.ru" target="_blank">mmobitva.ru</a>
        </div>
        <div class="categories">
            <button class="cat-btn" onclick="location.href='index.html'">🏠 Главная</button>
            <button class="cat-btn" onclick="location.reload()">🔄 Обновить</button>
            <button class="cat-btn" id="historyBtn">📜 ИСТОРИЯ ТАЙМЕРОВ</button>
            
        </div>
        
        <button class="toggle-timers-btn" id="toggleTimersBtn">⏰ ПОКАЗАТЬ ТАЙМЕРЫ</button>
        
        <div class="characters-container" id="charactersContainer">
            <div class="profile-container" id="profile-container"></div>
            <div style="margin-top:20px; text-align:center;">
                <button class="add-character-btn" onclick="openAddCharModal()">➕ ДОБАВИТЬ ПЕРСОНАЖА</button>
            </div>
        </div>

        <div style="margin-top:20px; text-align:center;">
            <button class="change-password-btn" onclick="openChangePasswordModal()">🔑 Сменить пароль</button>
            <button class="change-password-btn" onclick="location.href='calculator.html'" style="background: linear-gradient(135deg, #6b6509, #615200); border: 2px solid #ffdd88;">
                🧮 КАЛЬКУЛЯТОР СУЩНОСТЕЙ
            </button>
        </div>
    </div>

    <!-- Модалка добавления персонажа -->
    <div id="addCharModal" class="modal" style="display:none;">
        <div class="add-char-modal">
            <h2>➕ НОВЫЙ ПЕРСОНАЖ</h2>
            <input type="text" id="charName" placeholder="Введите имя персонажа">
            <div class="modal-buttons">
                <button class="modal-save-btn" onclick="addCharacterHandler()">💾 СОХРАНИТЬ</button>
                <button class="modal-cancel-btn" onclick="closeAddCharModal()">❌ ОТМЕНА</button>
            </div>
        </div>
    </div>

    <!-- Модалка редактирования персонажа -->
    <div id="editCharModal" class="modal" style="display:none;">
        <div class="add-char-modal">
            <h2>✏️ РЕДАКТИРОВАТЬ ПЕРСОНАЖА</h2>
            <input type="hidden" id="editCharId">
            <input type="text" id="editCharName" placeholder="Введите новое имя персонажа">
            <div class="form-group">
                <label>🎨 Цветовая схема</label>
                <div class="color-scheme-selector" id="colorSchemeSelector"></div>
            </div>
            <div class="modal-buttons">
                <button class="modal-save-btn" onclick="saveEditCharacterHandler()">💾 СОХРАНИТЬ</button>
                <button class="modal-cancel-btn" onclick="closeEditCharModal()">❌ ОТМЕНА</button>
            </div>
        </div>
    </div>

    <!-- Модалка выбора аватарки -->
    <div id="avatarModal" class="modal" style="display:none;">
        <div class="add-char-modal">
            <h2>🎨 ВЫБЕРИТЕ АВАТАРКУ</h2>
            <input type="hidden" id="avatarCharacterId">
            <div class="avatar-grid" id="avatarGrid"></div>
            <div class="modal-buttons">
                <button class="modal-cancel-btn" onclick="closeAvatarModal()">❌ ОТМЕНА</button>
            </div>
        </div>
    </div>

    <!-- Модалка смены пароля -->
    <div id="changePasswordModal" class="modal" style="display:none;">
        <div class="add-char-modal">
            <h2>🔑 СМЕНА ПАРОЛЯ</h2>
            <div class="form-group">
                <label>🔒 ТЕКУЩИЙ ПАРОЛЬ</label>
                <input type="password" id="oldPassword" placeholder="Введите текущий пароль">
            </div>
            <div class="form-group">
                <label>🔒 НОВЫЙ ПАРОЛЬ</label>
                <input type="password" id="newPassword" placeholder="Введите новый пароль">
            </div>
            <div class="form-group">
                <label>🔒 ПОДТВЕРЖДЕНИЕ</label>
                <input type="password" id="confirmNewPassword" placeholder="Повторите новый пароль">
            </div>
            <div class="modal-buttons">
                <button class="modal-save-btn" onclick="changePasswordHandler()">💾 СОХРАНИТЬ</button>
                <button class="modal-cancel-btn" onclick="closeChangePasswordModal()">❌ ОТМЕНА</button>
            </div>
        </div>
    </div>

    <!-- Модалка таймера -->
    <div id="timerModal" class="modal" style="display:none;">
        <div class="timer-modal-content">
            <h2 id="timerModalTitle">⏱️ НАСТРОЙКА ТАЙМЕРА</h2>
            <input type="hidden" id="currentCharacterId">
            <input type="hidden" id="currentTimerId">

            <div class="quick-templates">
                <button type="button" class="quick-template-btn" onclick="setQuickTemplate(1,0,0)">⚡ 1 час</button>
                <button type="button" class="quick-template-btn" onclick="setQuickTemplate(0,24,0)">📅 1 день</button>
                <button type="button" class="quick-template-btn" onclick="setQuickTemplate(0,168,0)">🗓️ 1 неделя</button>
                <button type="button" class="quick-template-btn" onclick="setQuickTemplate(0,0,30)">⏰ 30 минут</button>
            </div>

            <div class="form-group">
                <label>📝 НАЗВАНИЕ КВЕСТА / ЗАДАНИЯ</label>
                <input type="text" id="questName" placeholder="Пример: Зачистка подземелья">
            </div>

            <div class="form-group">
                <label>⏰ ВРЕМЯ ДО ЗАВЕРШЕНИЯ</label>
                <div class="time-input-group">
                    <div class="time-field">
                        <label>ДНИ</label>
                        <input type="number" id="timerDays" min="0" value="0" placeholder="0">
                    </div>
                    <div class="time-field">
                        <label>ЧАСЫ</label>
                        <input type="number" id="timerHours" min="0" max="999" value="0" placeholder="0">
                    </div>
                    <div class="time-field">
                        <label>МИНУТЫ</label>
                        <input type="number" id="timerMinutes" min="0" max="59" value="0" placeholder="0">
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>📝 ЗАМЕТКИ</label>
                <textarea id="timerNotes" rows="3" placeholder="Дополнительные заметки по заданию..."></textarea>
            </div>

            <div class="modal-buttons">
                <button class="modal-save-btn" onclick="saveTimerHandler()">💾 СОХРАНИТЬ</button>
                <button class="modal-cancel-btn" onclick="closeTimerModal()">❌ ОТМЕНА</button>
            </div>
        </div>
    </div>

    <!-- Модалка истории -->
    <div id="historyModal" class="modal" style="display:none;">
        <div class="history-modal-content">
            <div class="history-modal-header">
                <h2>📜 ИСТОРИЯ ТАЙМЕРОВ</h2>
                <div class="history-modal-close" onclick="closeHistoryModal()">✕</div>
            </div>
            <div class="history-filters">
                <select id="historyCharacterFilter">
                    <option value="all">👥 Все персонажи</option>
                </select>
                <input type="text" id="historySearch" placeholder="🔍 Поиск по названию...">
                <button class="history-export-btn" id="exportHistoryBtn">📥 Экспорт в CSV</button>
                <button class="history-clear-btn" id="clearHistoryBtn">🗑️ Очистить историю</button>
            </div>
            <div class="history-list" id="historyList"></div>
            <div class="modal-buttons">
                <button class="cat-btn" style="margin: 10px" onclick="closeHistoryModal()">❌ ЗАКРЫТЬ</button>
            </div>
        </div>
    </div>

    <!-- Модалка редактирования заметки -->
    <div id="editHistoryNoteModal" class="modal" style="display:none;">
        <div class="edit-note-modal">
            <h2>✏️ РЕДАКТИРОВАТЬ ЗАМЕТКУ</h2>
            <input type="hidden" id="editHistoryId">
            <textarea id="editHistoryNote" rows="4" placeholder="Введите заметку..."></textarea>
            <div class="modal-buttons">
                <button class="modal-save-btn" onclick="saveHistoryNote()">💾 СОХРАНИТЬ</button>
                <button class="modal-cancel-btn" onclick="closeEditHistoryNoteModal()">❌ ОТМЕНА</button>
            </div>
        </div>
    </div>

    <script src="js/db.js"></script>
    <script src="js/common.js"></script>
    <script>
        const currentUser = checkAuth();
        if (!currentUser) { window.location.href = 'auth.html'; }

        let characters = [];
        let timersCache = {};
        let timerUpdateInterval = null;
        let isTimersVisible = false;

        const avatarList = ['👤', '😀', '😎', '🥷', '🧙', '🦸', '🐉', '⚔️', '🛡️', '🏹', '🔮', '💀', '👑', '⭐', '🔥', '❄️', '🌊', '🌿', '⚡', '🌈'];
        
        const colorSchemes = [
            { id: 'gold', name: '🥇 Золотой', color: '#ffaa44' },
            { id: 'silver', name: '🥈 Серебряный', color: '#c0c0c0' },
            { id: 'bronze', name: '🥉 Бронзовый', color: '#cd7f32' },
            { id: 'green', name: '🌿 Зеленый', color: '#44ff88' },
            { id: 'red', name: '🔴 Красный', color: '#ff4444' },
            { id: 'blue', name: '🔵 Синий', color: '#44aaff' },
            { id: 'purple', name: '🟣 Фиолетовый', color: '#ff44aa' }
        ];

        // ==================== СОХРАНЕНИЕ ФЛАГОВ ИСТОРИИ ====================
        function saveHistoryFlags() {
            const flags = {};
            for (const char of characters) {
                const timers = timersCache[char.id] || [];
                for (const timer of timers) {
                    if (timer.historyRecorded) {
                        flags[timer.id] = true;
                    }
                }
            }
            localStorage.setItem('timerHistoryFlags', JSON.stringify(flags));
        }

        async function loadCharacters() {
            characters = await getUserCharacters(currentUser.login);
            await loadAllTimers();
            renderProfile();
        }

        async function loadAllTimers() {
            const savedFlags = JSON.parse(localStorage.getItem('timerHistoryFlags') || '{}');
            
            const promises = characters.map(async char => {
                const timers = await getCharacterTimers(char.id);
                timersCache[char.id] = timers.map(t => ({
                    ...t,
                    historyRecorded: savedFlags[t.id] || false
                }));
            });
            await Promise.all(promises);
        }

        async function refreshTimersForCharacter(charId) {
            const timers = await getCharacterTimers(charId);
            const savedFlags = JSON.parse(localStorage.getItem('timerHistoryFlags') || '{}');
            timersCache[charId] = timers.map(t => ({
                ...t,
                historyRecorded: savedFlags[t.id] || false
            }));
            renderProfile();
        }

        function formatTime(ms) {
            if (ms <= 0) return '0с';
            const days = Math.floor(ms / (1000 * 60 * 60 * 24));
            const hours = Math.floor((ms % (86400000)) / 3600000);
            const minutes = Math.floor((ms % 3600000) / 60000);
            const seconds = Math.floor((ms % 60000) / 1000);
            const parts = [];
            if (days > 0) parts.push(`${days}д`);
            if (hours > 0 || days > 0) parts.push(`${hours}ч`);
            if (minutes > 0 || hours > 0 || days > 0) parts.push(`${minutes}м`);
            parts.push(`${seconds}с`);
            return parts.join(' ');
        }

        function formatDateTime(timestamp) {
            const date = new Date(timestamp);
            return `${date.toLocaleDateString()} ${date.toLocaleTimeString()}`;
        }

        function calculateProgress(endTime, duration) {
            if (duration <= 0) return 0;
            const elapsed = duration - (endTime - Date.now());
            let percent = (elapsed / duration) * 100;
            if (percent < 0) percent = 0;
            if (percent > 100) percent = 100;
            return percent;
        }

        async function renderProfile() {
            const container = document.getElementById('profile-container');
            if (!container) return;

            let html = '';
            for (const char of characters) {
                const timers = timersCache[char.id] || [];
                const colorScheme = char.color_scheme || 'gold';

                let timersHtml = '';
                if (timers.length > 0) {
                    for (const timer of timers) {
                        const remaining = timer.end_time - Date.now();
                        const isActive = timer.is_active && remaining > 0;
                        const timeStr = formatTime(remaining);
                        const progressPercent = calculateProgress(timer.end_time, timer.duration);

                        timersHtml += `
                            <div class="timer-item" data-timer-id="${timer.id}" data-character-id="${char.id}">
                                <div class="timer-info">
                                    <div class="timer-name-row">
                                        <span class="timer-name">${escapeHtml(timer.quest_name)}</span>
                                        <span class="timer-status ${isActive ? 'active' : 'inactive'}">${isActive ? 'АКТИВЕН' : 'ЗАВЕРШЁН'}</span>
                                    </div>
                                    <div class="timer-time-row">
                                        <span class="timer-time">${timeStr}</span>
                                    </div>
                                    <div class="timer-progress">
                                        <div class="timer-progress-bar" style="width:${progressPercent}%;"></div>
                                    </div>
                                </div>
                                <div class="timer-actions">
                                    <button class="timer-btn" onclick="event.stopPropagation(); editTimerHandler(${char.id}, ${timer.id})">✏️ РЕДАКТИРОВАТЬ</button>
                                    <button class="timer-btn" onclick="event.stopPropagation(); deleteTimerHandler(${char.id}, ${timer.id})">🗑️ УДАЛИТЬ</button>
                                    <button class="timer-btn" onclick="event.stopPropagation(); restartTimerHandler(${char.id}, ${timer.id})">🔄 РЕСТАРТ</button>
                                </div>
                            </div>
                        `;
                    }
                } else {
                    timersHtml = '<div class="no-timers">📭 Нет таймеров</div>';
                }

                html += `
                    <div class="character-card" data-scheme="${colorScheme}" data-char-id="${char.id}">
                        <div class="character-header">
                            <button class="refresh-all-btn" onclick="refreshAllTimers(${char.id})">🔄 Обновить все</button>
                            <div class="character-name">
                                <span class="character-avatar" onclick="openAvatarModal(${char.id})">${char.avatar || '👤'}</span>
                                ${escapeHtml(char.name)}
                                <button class="edit-char-scheme-btn" onclick="openEditCharModal(${char.id}, '${escapeHtml(char.name)}')" style="background:none; border:none; cursor:pointer; font-size:14px;"></button>
                            </div>
                            <div style="display:flex; gap:8px;">
                                <button class="edit-char-btn" onclick="openEditCharModal(${char.id}, '${escapeHtml(char.name)}')">✏️</button>
                                <button class="delete-char-btn" onclick="deleteCharacterHandler(${char.id})">🗑️ УДАЛИТЬ</button>
                            </div>
                        </div>
                        <div class="timer-list">
                            ${timersHtml}
                        </div>
                        <button class="add-timer-btn" onclick="openTimerModal(${char.id})">➕ ДОБАВИТЬ ТАЙМЕР</button>
                    </div>
                `;
            }

            container.innerHTML = html;
            initTimerClickHandler();
            startTimerUpdates();
        }

        function startTimerUpdates() {
            if (timerUpdateInterval) clearInterval(timerUpdateInterval);

            timerUpdateInterval = setInterval(async () => {
                if (!isTimersVisible) return;
                
                const container = document.getElementById('profile-container');
                if (!container) return;

                let needsUpdate = false;

                for (const char of characters) {
                    const timers = timersCache[char.id] || [];
                    for (const timer of timers) {
                        const remaining = timer.end_time - Date.now();
                        const timerElement = container.querySelector(`.timer-item[data-timer-id="${timer.id}"]`);
                        
                        if (timerElement) {
                            const timeSpan = timerElement.querySelector('.timer-time');
                            const progressBar = timerElement.querySelector('.timer-progress-bar');
                            const statusSpan = timerElement.querySelector('.timer-status');
                            
                            if (timeSpan) timeSpan.textContent = formatTime(remaining);
                            if (progressBar) progressBar.style.width = `${calculateProgress(timer.end_time, timer.duration)}%`;
                            
                            // Записываем в историю ТОЛЬКО если таймер только что завершился и еще не записан
                            if (remaining <= 0 && timer.is_active && !timer.historyRecorded) {
                                timer.historyRecorded = true;
                                timer.is_active = false;
                                needsUpdate = true;
                                
                                if (statusSpan) {
                                    statusSpan.textContent = 'ЗАВЕРШЁН';
                                    statusSpan.classList.remove('active');
                                    statusSpan.classList.add('inactive');
                                }
                                
                                await addTimerHistory({
                                    timer_id: timer.id,
                                    character_id: char.id,
                                    quest_name: timer.quest_name,
                                    start_time: new Date(timer.end_time - timer.duration).toISOString(),
                                    end_time: new Date(timer.end_time).toISOString(),
                                    duration: timer.duration,
                                    notes: timer.notes || ''
                                });
                                saveHistoryFlags();
                                
                                await toggleTimerActive(timer.id, false);
                            }
                        }
                    }
                }
                
                if (needsUpdate) {
                    for (const char of characters) {
                        const freshTimers = await getCharacterTimers(char.id);
                        const cachedTimers = timersCache[char.id] || [];
                        timersCache[char.id] = freshTimers.map(ft => {
                            const oldTimer = cachedTimers.find(ot => ot.id === ft.id);
                            return {
                                ...ft,
                                historyRecorded: oldTimer ? oldTimer.historyRecorded : false
                            };
                        });
                    }
                    renderProfile();
                }
            }, 1000);
        }

        function initTimerClickHandler() {
            document.querySelectorAll('.timer-item').forEach(timer => {
                timer.removeEventListener('click', timerClickHandler);
                timer.addEventListener('click', timerClickHandler);
            });
        }

        function timerClickHandler(e) {
            if (e.target.classList.contains('timer-btn')) {
                e.stopPropagation();
                return;
            }
            this.classList.toggle('expanded');
        }

        // ==================== ПОКАЗ/СКРЫТИЕ ТАЙМЕРОВ ====================
        function toggleTimers() {
            const container = document.getElementById('charactersContainer');
            const btn = document.getElementById('toggleTimersBtn');
            
            isTimersVisible = !isTimersVisible;
            
            if (isTimersVisible) {
                container.classList.add('show');
                btn.textContent = '🙈 СКРЫТЬ ТАЙМЕРЫ';
                if (document.getElementById('profile-container').innerHTML === '') {
                    loadCharacters();
                }
            } else {
                container.classList.remove('show');
                btn.textContent = '⏰ ПОКАЗАТЬ ТАЙМЕРЫ';
                setTimeout(() => {
                    if (!isTimersVisible) {
                        document.getElementById('profile-container').innerHTML = '';
                    }
                }, 1600);
            }
        }

        // ==================== ИСТОРИЯ ТАЙМЕРОВ ====================
        async function openHistoryModal() {
            const history = await getTimerHistory();
            const select = document.getElementById('historyCharacterFilter');
            
            select.innerHTML = '<option value="all">👥 Все персонажи</option>';
            for (const char of characters) {
                select.innerHTML += `<option value="${char.id}">🎮 ${escapeHtml(char.name)}</option>`;
            }
            
            renderHistoryList(history);
            document.getElementById('historyModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }
        
        function closeHistoryModal() {
            document.getElementById('historyModal').style.display = 'none';
            document.body.style.overflow = '';
        }
        
        async function renderHistoryList(history) {
            const container = document.getElementById('historyList');
            const filterChar = document.getElementById('historyCharacterFilter').value;
            const searchTerm = document.getElementById('historySearch').value.toLowerCase().trim();
            
            let filtered = [...history];
            
            if (filterChar !== 'all') {
                filtered = filtered.filter(h => h.character_id == filterChar);
            }
            
            if (searchTerm) {
                filtered = filtered.filter(h => h.quest_name.toLowerCase().includes(searchTerm));
            }
            
            if (filtered.length === 0) {
                container.innerHTML = '<div class="history-empty">📭 Нет записей в истории</div>';
                return;
            }
            
            let html = '';
            for (const item of filtered) {
                const char = characters.find(c => c.id === item.character_id);
                const charName = char ? char.name : 'Неизвестный';
                const startTime = formatDateTime(new Date(item.start_time).getTime());
                const endTime = formatDateTime(new Date(item.end_time).getTime());
                const durationFormatted = formatTime(item.duration);
                
                html += `
                    <div class="history-item" data-id="${item.id}">
                        <div class="history-header">
                            <span class="history-quest">📌 ${escapeHtml(item.quest_name)}</span>
                            <span class="history-character">🎮 ${escapeHtml(charName)}</span>
                        </div>
                        <div class="history-time">
                            <span>▶️ Старт: ${startTime}</span>
                            <span>⏹️ Финиш: ${endTime}</span>
                            <span>⏱️ Длительность: ${durationFormatted}</span>
                        </div>
                        <div class="history-notes">
                            <span class="history-notes-label">📝 Заметки:</span>
                            <span class="history-notes-text">${escapeHtml(item.notes || '—')}</span>
                            <button class="history-edit-note-btn" onclick="editHistoryNote(${item.id}, '${escapeHtml(item.notes || '').replace(/'/g, "\\'")}')">✏️</button>
                        </div>
                    </div>
                `;
            }
            container.innerHTML = html;
        }
        
        async function filterHistory() {
            const history = await getTimerHistory();
            renderHistoryList(history);
        }
        
        function editHistoryNote(id, currentNote) {
            document.getElementById('editHistoryId').value = id;
            document.getElementById('editHistoryNote').value = currentNote;
            document.getElementById('editHistoryNoteModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }
        
        function closeEditHistoryNoteModal() {
            document.getElementById('editHistoryNoteModal').style.display = 'none';
            document.body.style.overflow = '';
        }
        
        async function saveHistoryNote() {
            const id = parseInt(document.getElementById('editHistoryId').value);
            const note = document.getElementById('editHistoryNote').value.trim();
            await updateTimerHistoryNote(id, note);
            closeEditHistoryNoteModal();
            filterHistory();
            alert('✅ Заметка сохранена!');
        }
        
        async function exportHistoryToCSV() {
            const history = await getTimerHistory();
            const filterChar = document.getElementById('historyCharacterFilter').value;
            let filtered = [...history];
            
            if (filterChar !== 'all') {
                filtered = filtered.filter(h => h.character_id == filterChar);
            }
            
            if (filtered.length === 0) {
                alert('Нет данных для экспорта!');
                return;
            }
            
            let csv = '"ID","Персонаж","Задание","Дата старта","Дата финиша","Длительность (мс)","Заметки"\n';
            for (const item of filtered) {
                const char = characters.find(c => c.id === item.character_id);
                const charName = char ? char.name : 'Неизвестный';
                csv += `"${item.id}","${charName}","${item.quest_name}","${item.start_time}","${item.end_time}","${item.duration}","${(item.notes || '').replace(/"/g, '""')}"\n`;
            }
            
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.href = url;
            link.setAttribute('download', 'timer_history.csv');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }
        
        async function clearHistory() {
            if (!confirm('🗑️ Удалить ВСЮ историю таймеров? Это действие необратимо!')) return;
            await clearTimerHistory();
            filterHistory();
            alert('✅ История очищена!');
        }

        // ==================== БЫСТРЫЕ ШАБЛОНЫ ====================
        function setQuickTemplate(hours, totalHours, minutes) {
            document.getElementById('timerDays').value = 0;
            document.getElementById('timerHours').value = totalHours > 0 ? totalHours : hours;
            document.getElementById('timerMinutes').value = minutes;
        }

        // ==================== УПРАВЛЕНИЕ ПЕРСОНАЖАМИ ====================
        function openAddCharModal() { document.getElementById('addCharModal').style.display = 'flex'; }
        function closeAddCharModal() { document.getElementById('addCharModal').style.display = 'none'; document.getElementById('charName').value = ''; }

        async function addCharacterHandler() {
            const name = document.getElementById('charName').value.trim();
            if (!name) { alert('Введите имя персонажа!'); return; }
            await addCharacter(currentUser.login, name);
            closeAddCharModal();
            if (isTimersVisible) await loadCharacters();
        }

        async function deleteCharacterHandler(id) {
            if (confirm('Удалить персонажа и все его таймеры?')) {
                await deleteCharacter(id);
                delete timersCache[id];
                if (isTimersVisible) await loadCharacters();
            }
        }

        function openEditCharModal(charId, charName) {
            const char = characters.find(c => c.id === charId);
            document.getElementById('editCharId').value = charId;
            document.getElementById('editCharName').value = charName;
            
            const selector = document.getElementById('colorSchemeSelector');
            let schemeHtml = '';
            for (const scheme of colorSchemes) {
                const isSelected = (char?.color_scheme || 'gold') === scheme.id;
                schemeHtml += `
                    <div class="color-option" style="background:${scheme.color}; ${isSelected ? 'border-color:#ffaa44; box-shadow:0 0 8px #ffaa44;' : ''}" 
                         onclick="selectColorScheme('${scheme.id}')" title="${scheme.name}"></div>
                `;
            }
            selector.innerHTML = schemeHtml;
            window.selectedColorScheme = char?.color_scheme || 'gold';
            
            document.getElementById('editCharModal').style.display = 'flex';
        }

        function closeEditCharModal() {
            document.getElementById('editCharModal').style.display = 'none';
            document.getElementById('editCharName').value = '';
        }
        
        function selectColorScheme(schemeId) {
            window.selectedColorScheme = schemeId;
            document.querySelectorAll('.color-option').forEach(opt => {
                opt.style.borderColor = '#3a342a';
                opt.style.boxShadow = 'none';
            });
            const selectedOpt = Array.from(document.querySelectorAll('.color-option')).find(opt => {
                const bg = opt.style.background;
                if (schemeId === 'gold') return bg.includes('#ffaa44');
                if (schemeId === 'silver') return bg.includes('#c0c0c0');
                if (schemeId === 'bronze') return bg.includes('#cd7f32');
                if (schemeId === 'green') return bg.includes('#44ff88');
                if (schemeId === 'red') return bg.includes('#ff4444');
                if (schemeId === 'blue') return bg.includes('#44aaff');
                if (schemeId === 'purple') return bg.includes('#ff44aa');
                return false;
            });
            if (selectedOpt) {
                selectedOpt.style.borderColor = '#ffaa44';
                selectedOpt.style.boxShadow = '0 0 8px #ffaa44';
            }
        }

        async function saveEditCharacterHandler() {
            const charId = parseInt(document.getElementById('editCharId').value);
            const newName = document.getElementById('editCharName').value.trim();
            const newScheme = window.selectedColorScheme || 'gold';

            if (!newName) {
                alert('❌ Введите имя персонажа!');
                return;
            }

            const success = await updateCharacter(charId, { name: newName, color_scheme: newScheme });
            if (!success) {
                alert('❌ Ошибка при обновлении персонажа!');
                return;
            }

            closeEditCharModal();
            if (isTimersVisible) await loadCharacters();
            alert('✅ Персонаж обновлен!');
        }

        // ==================== АВАТАРКИ ====================
        function openAvatarModal(characterId) {
            document.getElementById('avatarCharacterId').value = characterId;
            const grid = document.getElementById('avatarGrid');

            let html = '<div class="avatar-grid-container">';
            for (const avatar of avatarList) {
                html += `<div class="avatar-option" onclick="selectAvatar(${characterId}, '${avatar}')">${avatar}</div>`;
            }
            html += '</div>';
            grid.innerHTML = html;

            document.getElementById('avatarModal').style.display = 'flex';
        }

        function closeAvatarModal() {
            document.getElementById('avatarModal').style.display = 'none';
        }

        async function selectAvatar(characterId, avatar) {
            const success = await updateCharacter(characterId, { avatar });
            if (!success) {
                alert('❌ Ошибка при выборе аватарки!');
                return;
            }
            closeAvatarModal();
            if (isTimersVisible) await loadCharacters();
        }

        // ==================== СМЕНА ПАРОЛЯ ====================
        function openChangePasswordModal() {
            document.getElementById('changePasswordModal').style.display = 'flex';
        }

        function closeChangePasswordModal() {
            document.getElementById('changePasswordModal').style.display = 'none';
            document.getElementById('oldPassword').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmNewPassword').value = '';
        }

        async function changePasswordHandler() {
            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmNewPassword').value;

            if (!oldPassword || !newPassword || !confirmPassword) {
                alert('❌ Заполните все поля!');
                return;
            }

            if (newPassword !== confirmPassword) {
                alert('❌ Новый пароль и подтверждение не совпадают!');
                return;
            }

            if (newPassword.length < 6) {
                alert('❌ Пароль должен быть не менее 6 символов!');
                return;
            }

            const result = await changePassword(currentUser.login, oldPassword, newPassword);
            if (!result.success) {
                alert(result.message);
                return;
            }

            alert(result.message);
            closeChangePasswordModal();
        }

        // ==================== ТАЙМЕРЫ ====================
        function openTimerModal(characterId, timerId = null, questName = '', days = 0, hours = 0, minutes = 0, notes = '') {
            document.getElementById('currentCharacterId').value = characterId;
            document.getElementById('currentTimerId').value = timerId || '';
            document.getElementById('questName').value = questName;
            document.getElementById('timerDays').value = days;
            document.getElementById('timerHours').value = hours;
            document.getElementById('timerMinutes').value = minutes;
            document.getElementById('timerNotes').value = notes;
            document.getElementById('timerModalTitle').innerText = timerId ? '✏️ РЕДАКТИРОВАНИЕ ТАЙМЕРА' : '➕ НОВЫЙ ТАЙМЕР';
            document.getElementById('timerModal').style.display = 'flex';
        }

        function closeTimerModal() { document.getElementById('timerModal').style.display = 'none'; }

        async function saveTimerHandler() {
            const characterId = parseInt(document.getElementById('currentCharacterId').value);
            const timerId = document.getElementById('currentTimerId').value;
            const questName = document.getElementById('questName').value.trim();
            const days = parseInt(document.getElementById('timerDays').value) || 0;
            const hours = parseInt(document.getElementById('timerHours').value) || 0;
            const minutes = parseInt(document.getElementById('timerMinutes').value) || 0;
            const notes = document.getElementById('timerNotes').value.trim(); // ЗАМЕТКИ

            if (!questName) { alert('Введите название квеста!'); return; }
            const totalMs = (days * 24 * 60 * 60 * 1000) + (hours * 60 * 60 * 1000) + (minutes * 60 * 1000);
            if (totalMs <= 0) { alert('Укажите время больше 0!'); return; }
            const endTime = Date.now() + totalMs;

            if (timerId) {
                await updateTimer(parseInt(timerId), questName, endTime, totalMs, notes);
            } else {
                const newTimer = await addTimer(characterId, questName, endTime, totalMs, notes);
                if (!newTimer) {
                    alert('❌ Ошибка при создании таймера!');
                    return;
                }
            }
            
            closeTimerModal();
            if (isTimersVisible) await refreshTimersForCharacter(characterId);
        }

        async function editTimerHandler(characterId, timerId) {
            const timers = timersCache[characterId] || [];
            const timer = timers.find(t => t.id === timerId);
            if (timer) {
                const remaining = timer.end_time - Date.now();
                const days = Math.floor(remaining / (1000 * 60 * 60 * 24));
                const hours = Math.floor((remaining % (86400000)) / 3600000);
                const minutes = Math.floor((remaining % 3600000) / 60000);
                openTimerModal(characterId, timerId, timer.quest_name, Math.max(0, days), Math.max(0, hours), Math.max(0, minutes), timer.notes || '');
            }
        }

        async function deleteTimerHandler(characterId, timerId) {
            if (confirm('Удалить таймер?')) {
                await deleteTimer(timerId);
                if (isTimersVisible) await refreshTimersForCharacter(characterId);
            }
        }

        async function restartTimerHandler(characterId, timerId) {
            const timers = timersCache[characterId] || [];
            const timer = timers.find(t => t.id === timerId);
            if (timer) {
                const endTime = Date.now() + timer.duration;
                await updateTimer(timerId, timer.quest_name, endTime, timer.duration, timer.notes || '');
                await toggleTimerActive(timerId, true);
                timer.historyRecorded = false;
                timer.is_active = true;
                saveHistoryFlags();
                if (isTimersVisible) await refreshTimersForCharacter(characterId);
            }
        }

        async function refreshAllTimers(characterId) {
            if (!confirm('🔄 Перезапустить ВСЕ квесты этого персонажа?')) return;

            const timers = timersCache[characterId] || [];
            if (timers.length === 0) {
                alert('❌ Нет таймеров для перезапуска!');
                return;
            }

            let refreshed = 0;
            for (const timer of timers) {
                if (timer.duration > 0) {
                    const endTime = Date.now() + timer.duration;
                    await updateTimer(timer.id, timer.quest_name, endTime, timer.duration, timer.notes || '');
                    await toggleTimerActive(timer.id, true);
                    timer.historyRecorded = false;
                    timer.is_active = true;
                    refreshed++;
                }
            }
            saveHistoryFlags();
            alert(`✅ Перезапущено ${refreshed} таймеров!`);
            if (isTimersVisible) await refreshTimersForCharacter(characterId);
        }

        // ==================== ЗАПУСК ====================
        document.getElementById('toggleTimersBtn')?.addEventListener('click', toggleTimers);
        document.getElementById('historyBtn')?.addEventListener('click', openHistoryModal);
        document.getElementById('historyCharacterFilter')?.addEventListener('change', filterHistory);
        document.getElementById('historySearch')?.addEventListener('input', filterHistory);
        document.getElementById('exportHistoryBtn')?.addEventListener('click', exportHistoryToCSV);
        document.getElementById('clearHistoryBtn')?.addEventListener('click', clearHistory);
    </script>
