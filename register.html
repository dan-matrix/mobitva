<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет - Автобаттл MMO</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <div class="wrapper">
        <div class="header-wrapper">
            <a href="https://mobitva.net" target="_blank">mobitva.net</a>
            <div class="site-title">👤 ЛИЧНЫЙ КАБИНЕТ 👤</div>
            <a href="https://mmobitva.ru" target="_blank">mmobitva.ru</a>
        </div>
        <div class="categories">
            <button class="cat-btn" onclick="location.href='index.html'">🏠 Главная</button>
            <button class="cat-btn" onclick="location.reload()">🔄 Обновить</button>
        </div>
        <div class="profile-container" id="profile-container"></div>

        <!-- Кнопка смены пароля -->
        <div style="margin-top:20px; text-align:center;">
            <button class="change-password-btn" onclick="openChangePasswordModal()">🔑 Сменить пароль</button>
        </div>
    </div>

    <!-- Модалка добавления персонажа -->
    <div id="addCharModal" class="modal" style="display:none;">
        <div class="add-char-modal">
            <h2>➕ НОВЫЙ ПЕРСОНАЖ</h2>
            <input type="text" id="charName" placeholder="Введите имя персонажа">
            <div class="modal-buttons">
                <button class="modal-save-btn" onclick="addCharacterHandler()">💾 СОХРАНИТЬ</button>
                <button class="modal-cancel-btn" onclick="closeAddCharModal()">❌ ОТМЕНА</button>
            </div>
        </div>
    </div>

    <!-- Модалка редактирования персонажа -->
    <div id="editCharModal" class="modal" style="display:none;">
        <div class="add-char-modal">
            <h2>✏️ РЕДАКТИРОВАТЬ ПЕРСОНАЖА</h2>
            <input type="hidden" id="editCharId">
            <input type="text" id="editCharName" placeholder="Введите новое имя персонажа">
            <div class="modal-buttons">
                <button class="modal-save-btn" onclick="saveEditCharacterHandler()">💾 СОХРАНИТЬ</button>
                <button class="modal-cancel-btn" onclick="closeEditCharModal()">❌ ОТМЕНА</button>
            </div>
        </div>
    </div>

    <!-- Модалка выбора аватарки -->
    <div id="avatarModal" class="modal" style="display:none;">
        <div class="add-char-modal">
            <h2>🎨 ВЫБЕРИТЕ АВАТАРКУ</h2>
            <input type="hidden" id="avatarCharacterId">
            <div class="avatar-grid" id="avatarGrid"></div>
            <div class="modal-buttons">
                <button class="modal-cancel-btn" onclick="closeAvatarModal()">❌ ОТМЕНА</button>
            </div>
        </div>
    </div>

    <!-- Модалка смены пароля -->
    <div id="changePasswordModal" class="modal" style="display:none;">
        <div class="add-char-modal">
            <h2>🔑 СМЕНА ПАРОЛЯ</h2>
            <div class="form-group">
                <label>🔒 ТЕКУЩИЙ ПАРОЛЬ</label>
                <input type="password" id="oldPassword" placeholder="Введите текущий пароль">
            </div>
            <div class="form-group">
                <label>🔒 НОВЫЙ ПАРОЛЬ</label>
                <input type="password" id="newPassword" placeholder="Введите новый пароль">
            </div>
            <div class="form-group">
                <label>🔒 ПОДТВЕРЖДЕНИЕ</label>
                <input type="password" id="confirmNewPassword" placeholder="Повторите новый пароль">
            </div>
            <div class="modal-buttons">
                <button class="modal-save-btn" onclick="changePasswordHandler()">💾 СОХРАНИТЬ</button>
                <button class="modal-cancel-btn" onclick="closeChangePasswordModal()">❌ ОТМЕНА</button>
            </div>
        </div>
    </div>

    <!-- Модалка таймера -->
    <div id="timerModal" class="modal" style="display:none;">
        <div class="timer-modal-content">
            <h2 id="timerModalTitle">⏱️ НАСТРОЙКА ТАЙМЕРА</h2>
            <input type="hidden" id="currentCharacterId">
            <input type="hidden" id="currentTimerId">

            <div class="form-group">
                <label>📝 НАЗВАНИЕ КВЕСТА / ЗАДАНИЯ</label>
                <input type="text" id="questName" placeholder="Пример: Зачистка подземелья">
            </div>

            <div class="form-group">
                <label>⏰ ВРЕМЯ ДО ЗАВЕРШЕНИЯ</label>
                <div class="time-input-group">
                    <div class="time-field">
                        <label>ДНИ</label>
                        <input type="number" id="timerDays" min="0" value="0" placeholder="0">
                    </div>
                    <div class="time-field">
                        <label>ЧАСЫ</label>
                        <input type="number" id="timerHours" min="0" max="23" value="0" placeholder="0">
                    </div>
                    <div class="time-field">
                        <label>МИНУТЫ</label>
                        <input type="number" id="timerMinutes" min="0" max="59" value="0" placeholder="0">
                    </div>
                </div>
            </div>

            <div class="modal-buttons">
                <button class="modal-save-btn" onclick="saveTimerHandler()">💾 СОХРАНИТЬ</button>
                <button class="modal-cancel-btn" onclick="closeTimerModal()">❌ ОТМЕНА</button>
            </div>
        </div>
    </div>

    <script src="js/db.js"></script>
    <script src="js/common.js"></script>
    <script>
        const currentUser = checkAuth();
        if (!currentUser) { window.location.href = 'auth.html'; }

        let characters = [];
        let timersCache = {};
        let timerUpdateInterval = null;

        // Список доступных аватарок
        const avatarList = ['👤', '😀', '😎', '🥷', '🧙', '🦸', '🐉', '⚔️', '🛡️', '🏹', '🔮', '💀', '👑', '⭐', '🔥', '❄️', '🌊', '🌿', '⚡', '🌈'];

        // ========== ЗАГРУЗКА ДАННЫХ ==========
        async function loadCharacters() {
            characters = await getUserCharacters(currentUser.login);
            await loadAllTimers();
            renderProfile();
        }

        async function loadAllTimers() {
            const promises = characters.map(async char => {
                timersCache[char.id] = await getCharacterTimers(char.id);
            });
            await Promise.all(promises);
        }

        async function refreshTimersForCharacter(charId) {
            timersCache[charId] = await getCharacterTimers(charId);
            renderProfile();
        }

        // ========== ФОРМАТИРОВАНИЕ ==========
        function formatTime(ms) {
            if (ms <= 0) return '0с';
            const days = Math.floor(ms / (1000 * 60 * 60 * 24));
            const hours = Math.floor((ms % (86400000)) / 3600000);
            const minutes = Math.floor((ms % 3600000) / 60000);
            const seconds = Math.floor((ms % 60000) / 1000);
            const parts = [];
            if (days > 0) parts.push(`${days}д`);
            if (hours > 0 || days > 0) parts.push(`${hours}ч`);
            if (minutes > 0 || hours > 0 || days > 0) parts.push(`${minutes}м`);
            parts.push(`${seconds}с`);
            return parts.join(' ');
        }

        function calculateProgress(endTime, duration) {
            if (duration <= 0) return 0;
            const elapsed = duration - (endTime - Date.now());
            let percent = (elapsed / duration) * 100;
            if (percent < 0) percent = 0;
            if (percent > 100) percent = 100;
            return percent;
        }

        // ========== РЕНДЕР ПРОФИЛЯ ==========
        async function renderProfile() {
            const container = document.getElementById('profile-container');
            if (!container) return;

            let html = '';
            for (const char of characters) {
                const timers = timersCache[char.id] || [];

                let timersHtml = '';
                if (timers.length > 0) {
                    for (const timer of timers) {
                        const remaining = timer.end_time - Date.now();
                        const isActive = timer.is_active && remaining > 0;
                        const timeStr = formatTime(remaining);
                        const progressPercent = calculateProgress(timer.end_time, timer.duration);

                        if (remaining <= 0 && timer.is_active) {
                            timer.is_active = false;
                            db.from('user_timers').update({ is_active: false }).eq('id', timer.id);
                        }

                        timersHtml += `
                            <div class="timer-item" data-timer-id="${timer.id}" data-character-id="${char.id}">
                                <div class="timer-info">
                                    <div class="timer-name-row">
                                        <span class="timer-name">${escapeHtml(timer.quest_name)}</span>
                                        <span class="timer-status ${isActive ? 'active' : 'inactive'}">${isActive ? 'АКТИВЕН' : 'ЗАВЕРШЁН'}</span>
                                    </div>
                                    <div class="timer-time-row">
                                        <span class="timer-time">${timeStr}</span>
                                    </div>
                                    <div class="timer-progress">
                                        <div class="timer-progress-bar" style="width:${progressPercent}%;"></div>
                                    </div>
                                </div>
                                <div class="timer-actions">
                                    <button class="timer-btn" onclick="event.stopPropagation(); editTimerHandler(${char.id}, ${timer.id})">✏️ РЕДАКТИРОВАТЬ</button>
                                    <button class="timer-btn" onclick="event.stopPropagation(); deleteTimerHandler(${char.id}, ${timer.id})">🗑️ УДАЛИТЬ</button>
                                    ${!isActive && remaining <= 0 ? `<button class="timer-btn" onclick="event.stopPropagation(); restartTimerHandler(${char.id}, ${timer.id})">🔄 РЕСТАРТ</button>` : ''}
                                </div>
                            </div>
                        `;
                    }
                } else {
                    timersHtml = '<div class="no-timers">📭 Нет таймеров</div>';
                }

                html += `
                    <div class="character-card">
                        <div class="character-header">
                            <button class="refresh-all-btn" onclick="refreshAllTimers(${char.id})">🔄 Обновить все</button>
                            <div class="character-name">
                                <span class="character-avatar" onclick="openAvatarModal(${char.id})">${char.avatar || '👤'}</span>
                                ${escapeHtml(char.name)}
                            </div>
                            <div style="display:flex; gap:8px;">
                                <button class="edit-char-btn" onclick="openEditCharModal(${char.id}, '${escapeHtml(char.name)}')">✏️</button>
                                <button class="delete-char-btn" onclick="deleteCharacterHandler(${char.id})">🗑️ УДАЛИТЬ</button>
                            </div>
                        </div>
                        <div class="timer-list">
                            ${timersHtml}
                        </div>
                        <button class="add-timer-btn" onclick="openTimerModal(${char.id})">➕ ДОБАВИТЬ ТАЙМЕР</button>
                    </div>
                `;
            }

            html += `<button class="add-character-btn" onclick="openAddCharModal()">➕ ДОБАВИТЬ ПЕРСОНАЖА</button>`;

            container.innerHTML = html;
            initTimerClickHandler();
            startTimerUpdates();
        }

        // ========== ОБНОВЛЕНИЕ ВРЕМЕНИ ==========
        function startTimerUpdates() {
            if (timerUpdateInterval) clearInterval(timerUpdateInterval);

            timerUpdateInterval = setInterval(() => {
                const container = document.getElementById('profile-container');
                if (!container) return;

                document.querySelectorAll('.timer-item').forEach(timerElement => {
                    const timerId = parseInt(timerElement.dataset.timerId);
                    const charId = parseInt(timerElement.dataset.characterId);

                    const timers = timersCache[charId] || [];
                    const timer = timers.find(t => t.id === timerId);

                    if (timer) {
                        const remaining = timer.end_time - Date.now();
                        const isActive = timer.is_active && remaining > 0;
                        const timeStr = formatTime(remaining);
                        const progressPercent = calculateProgress(timer.end_time, timer.duration);

                        const timeSpan = timerElement.querySelector('.timer-time');
                        if (timeSpan) timeSpan.textContent = timeStr;

                        const progressBar = timerElement.querySelector('.timer-progress-bar');
                        if (progressBar) progressBar.style.width = `${progressPercent}%`;

                        if (remaining <= 0 && timer.is_active) {
                            timer.is_active = false;
                            const statusSpan = timerElement.querySelector('.timer-status');
                            if (statusSpan) {
                                statusSpan.textContent = 'ЗАВЕРШЁН';
                                statusSpan.classList.remove('active');
                                statusSpan.classList.add('inactive');
                            }
                            db.from('user_timers').update({ is_active: false }).eq('id', timer.id);
                        }
                    }
                });
            }, 1000);
        }

        // ========== КЛИКАБЕЛЬНЫЕ ТАЙМЕРЫ ==========
        function initTimerClickHandler() {
            document.querySelectorAll('.timer-item').forEach(timer => {
                timer.removeEventListener('click', timerClickHandler);
                timer.addEventListener('click', timerClickHandler);
            });
        }

        function timerClickHandler(e) {
            if (e.target.classList.contains('timer-btn')) {
                e.stopPropagation();
                return;
            }
            this.classList.toggle('expanded');
        }

        // ========== УПРАВЛЕНИЕ ПЕРСОНАЖАМИ ==========
        function openAddCharModal() { document.getElementById('addCharModal').style.display = 'flex'; }
        function closeAddCharModal() { document.getElementById('addCharModal').style.display = 'none'; document.getElementById('charName').value = ''; }

        async function addCharacterHandler() {
            const name = document.getElementById('charName').value.trim();
            if (!name) { alert('Введите имя персонажа!'); return; }
            await addCharacter(currentUser.login, name);
            closeAddCharModal();
            await loadCharacters();
        }

        async function deleteCharacterHandler(id) {
            if (confirm('Удалить персонажа и все его таймеры?')) {
                await deleteCharacter(id);
                delete timersCache[id];
                await loadCharacters();
            }
        }

        function openEditCharModal(charId, charName) {
            document.getElementById('editCharId').value = charId;
            document.getElementById('editCharName').value = charName;
            document.getElementById('editCharModal').style.display = 'flex';
        }

        function closeEditCharModal() {
            document.getElementById('editCharModal').style.display = 'none';
            document.getElementById('editCharName').value = '';
        }

        async function saveEditCharacterHandler() {
            const charId = parseInt(document.getElementById('editCharId').value);
            const newName = document.getElementById('editCharName').value.trim();

            if (!newName) {
                alert('❌ Введите имя персонажа!');
                return;
            }

            const { error } = await db.from('user_characters').update({ name: newName }).eq('id', charId);
            if (error) {
                alert('❌ Ошибка при обновлении!');
                return;
            }

            closeEditCharModal();
            await loadCharacters();
            alert('✅ Имя персонажа обновлено!');
        }

        // ========== АВАТАРКИ ==========
        function openAvatarModal(characterId) {
            document.getElementById('avatarCharacterId').value = characterId;
            const grid = document.getElementById('avatarGrid');

            let html = '<div class="avatar-grid-container">';
            for (const avatar of avatarList) {
                html += `<div class="avatar-option" onclick="selectAvatar(${characterId}, '${avatar}')">${avatar}</div>`;
            }
            html += '</div>';
            grid.innerHTML = html;

            document.getElementById('avatarModal').style.display = 'flex';
        }

        function closeAvatarModal() {
            document.getElementById('avatarModal').style.display = 'none';
        }

        async function selectAvatar(characterId, avatar) {
            const { error } = await db.from('user_characters').update({ avatar: avatar }).eq('id', characterId);
            if (error) {
                alert('❌ Ошибка при выборе аватарки!');
                return;
            }
            closeAvatarModal();
            await loadCharacters();
        }

        // ========== СМЕНА ПАРОЛЯ ==========
        function openChangePasswordModal() {
            document.getElementById('changePasswordModal').style.display = 'flex';
        }

        function closeChangePasswordModal() {
            document.getElementById('changePasswordModal').style.display = 'none';
            document.getElementById('oldPassword').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmNewPassword').value = '';
        }

        async function changePasswordHandler() {
            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmNewPassword').value;

            if (!oldPassword || !newPassword || !confirmPassword) {
                alert('❌ Заполните все поля!');
                return;
            }

            if (newPassword !== confirmPassword) {
                alert('❌ Новый пароль и подтверждение не совпадают!');
                return;
            }

            if (newPassword.length < 4) {
                alert('❌ Пароль должен быть не менее 4 символов!');
                return;
            }

            const user = await loginUser(currentUser.login, oldPassword);
            if (!user) {
                alert('❌ Неверный текущий пароль!');
                return;
            }

            const { error } = await db.from('users').update({ password: newPassword }).eq('login', currentUser.login);

            if (error) {
                alert('❌ Ошибка при смене пароля!');
                console.error(error);
                return;
            }

            alert('✅ Пароль успешно изменен!');
            closeChangePasswordModal();
        }

        // ========== УПРАВЛЕНИЕ ТАЙМЕРАМИ ==========
        function openTimerModal(characterId, timerId = null, questName = '', days = 0, hours = 0, minutes = 0) {
            document.getElementById('currentCharacterId').value = characterId;
            document.getElementById('currentTimerId').value = timerId || '';
            document.getElementById('questName').value = questName;
            document.getElementById('timerDays').value = days;
            document.getElementById('timerHours').value = hours;
            document.getElementById('timerMinutes').value = minutes;
            document.getElementById('timerModalTitle').innerText = timerId ? '✏️ РЕДАКТИРОВАНИЕ ТАЙМЕРА' : '➕ НОВЫЙ ТАЙМЕР';
            document.getElementById('timerModal').style.display = 'flex';
        }

        function closeTimerModal() { document.getElementById('timerModal').style.display = 'none'; }

        async function saveTimerHandler() {
            const characterId = parseInt(document.getElementById('currentCharacterId').value);
            const timerId = document.getElementById('currentTimerId').value;
            const questName = document.getElementById('questName').value.trim();
            const days = parseInt(document.getElementById('timerDays').value) || 0;
            const hours = parseInt(document.getElementById('timerHours').value) || 0;
            const minutes = parseInt(document.getElementById('timerMinutes').value) || 0;

            if (!questName) { alert('Введите название квеста!'); return; }
            const totalMs = (days * 24 * 60 * 60 * 1000) + (hours * 60 * 60 * 1000) + (minutes * 60 * 1000);
            if (totalMs <= 0) { alert('Укажите время больше 0!'); return; }
            const endTime = Date.now() + totalMs;

            if (timerId) {
                await updateTimer(parseInt(timerId), questName, endTime, totalMs);
            } else {
                await addTimer(characterId, questName, endTime, totalMs);
            }
            closeTimerModal();
            await refreshTimersForCharacter(characterId);
        }

        async function editTimerHandler(characterId, timerId) {
            const timers = timersCache[characterId] || [];
            const timer = timers.find(t => t.id === timerId);
            if (timer) {
                const remaining = timer.end_time - Date.now();
                const days = Math.floor(remaining / (1000 * 60 * 60 * 24));
                const hours = Math.floor((remaining % (86400000)) / 3600000);
                const minutes = Math.floor((remaining % 3600000) / 60000);
                openTimerModal(characterId, timerId, timer.quest_name, Math.max(0, days), Math.max(0, hours), Math.max(0, minutes));
            }
        }

        async function deleteTimerHandler(characterId, timerId) {
            if (confirm('Удалить таймер?')) {
                await deleteTimer(timerId);
                await refreshTimersForCharacter(characterId);
            }
        }

        async function restartTimerHandler(characterId, timerId) {
            const timers = timersCache[characterId] || [];
            const timer = timers.find(t => t.id === timerId);
            if (timer) {
                const endTime = Date.now() + timer.duration;
                await updateTimer(timerId, timer.quest_name, endTime, timer.duration);
                await db.from('user_timers').update({ is_active: true }).eq('id', timerId);
                await refreshTimersForCharacter(characterId);
            }
        }

        async function refreshAllTimers(characterId) {
            if (!confirm('🔄 Перезапустить ВСЕ квесты этого персонажа?')) return;

            const timers = timersCache[characterId] || [];
            if (timers.length === 0) {
                alert('❌ Нет таймеров для перезапуска!');
                return;
            }

            let refreshed = 0;
            for (const timer of timers) {
                if (timer.duration > 0) {
                    const endTime = Date.now() + timer.duration;
                    await updateTimer(timer.id, timer.quest_name, endTime, timer.duration);
                    await db.from('user_timers').update({ is_active: true }).eq('id', timer.id);
                    refreshed++;
                }
            }

            alert(`✅ Перезапущено ${refreshed} таймеров!`);
            await refreshTimersForCharacter(characterId);
        }

        // ========== ЗАПУСК ==========
        loadCharacters();
    </script>
</body>

</html>
